# ⚠️ ملف CI جاهز للتفعيل — لكنه خارج .github/workflows عمداً:
# توكن GitHub App الحالي لا يملك صلاحية `workflows` فيرفض git رفعه.
# التفعيل: انسخ هذا الملف إلى .github/workflows/ci.yml من واجهة GitHub
# (Add file → upload) أو امنح التوكن صلاحية workflows ثم حرّكه محلياً.

name: CI — نواة أثير

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  backend:
    name: اختبارات الخادم (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" sqlalchemy pydantic \
            pydantic-settings PyJWT argon2-cffi pyotp pytest httpx
      - name: تشغيل الاختبارات
        working-directory: backend
        run: python -m pytest

  frontend:
    name: بناء الواجهة (Vite + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: تثبيت وبناء
        working-directory: frontend
        run: |
          npm ci
          npm run build
